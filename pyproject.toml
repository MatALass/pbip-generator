[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pbip-generator"
version = "0.2.0"
description = "Generate ready-to-open Power BI projects (PBIP: TMDL + PBIR) from CSV/Excel files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mathieu" }]
keywords = ["power-bi", "pbip", "tmdl", "pbir", "semantic-model", "mcp", "data-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Code Generators",
]
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "PyYAML>=6.0", "pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/MatALass/pbip-generator"
Changelog = "https://github.com/MatALass/pbip-generator/blob/main/CHANGELOG.md"
Issues = "https://github.com/MatALass/pbip-generator/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["mcp>=2.3,<3", "pytest>=8", "pytest-cov>=5", "jsonschema>=4.21", "referencing>=0.35", "ruff>=0.5"]

[project.scripts]
pbip-generator = "pbip_generator.cli:main"
pbip-generator-mcp = "pbip_generator.mcp_server:main"

[tool.hatch.build.targets.sdist]
exclude = ["tests/golden", "docs/images", ".github", "tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/pbip_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
