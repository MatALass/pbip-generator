name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package and uploads it to PyPI with trusted
# publishing: no API token is stored. One-time setup on PyPI, in the project's (or a pending)
# publisher settings: owner MatALass, repository pbip-generator, workflow release.yml,
# environment pypi.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" || {
            echo "tag ${{ github.event.release.tag_name }} != version $version"; exit 1; }
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
